<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#f2f2f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Электронный дневник</title>
<style>
:root{--bg:#f2f2f4;--c:#fff;--t:#111;--m:#6f6f76;--line:#e5e5ea;--p:#111;--pt:#fff;--soft:#efeff2;--e:#d93b3b;--ok:#1f9d55;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0c0e;--c:#1a1a1d;--t:#f2f2f3;--m:#9a9aa2;--line:#2b2b30;--p:#f2f2f3;--pt:#111;--soft:#26262a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c0c0e;--c:#1a1a1d;--t:#f2f2f3;--m:#9a9aa2;--line:#2b2b30;--p:#f2f2f3;--pt:#111;--soft:#26262a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top b{font-size:20px;letter-spacing:-.02em}
.top span{display:flex;align-items:center}
.card{background:var(--c);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:20px;letter-spacing:-.02em}
input,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid transparent;border-radius:12px;margin:6px 0 10px;background:var(--soft);color:var(--t);outline:0;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--t)}
::placeholder{color:var(--m)}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;color:inherit;transition:transform .12s ease,opacity .12s,background-color .15s,color .15s}
button:active{transform:scale(.95)}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--p);color:var(--pt);font-weight:600}
.btn:disabled{opacity:.5}
.sm{padding:8px 14px;border:1px solid var(--line);background:var(--c);color:var(--t);border-radius:999px;margin:8px 8px 0 0;font-size:14px;font-weight:500}
.sm.on{background:var(--p);color:var(--pt);border-color:var(--p)}
label.sm{display:inline-block}
.chip{padding:6px 12px;border:1px dashed var(--m);border-radius:999px;background:transparent;font-size:14px}
.lnk{background:none;border:0;padding:8px 0 8px 14px;font-size:15px;color:var(--m);display:inline-flex;align-items:center}
.msg{color:var(--e);margin:4px 0 8px}
.info{color:var(--ok);margin:4px 0 8px}
.badge{font-size:13px;color:var(--m)}
.tabs{display:flex;gap:6px;margin:10px 0 12px;background:var(--soft);padding:4px;border-radius:14px}
.tab{flex:1;padding:9px 4px;border:0;border-radius:11px;background:transparent;color:var(--m);font-weight:500}
.tab.on{background:var(--p);color:var(--pt)}
.tab small{opacity:.75}
.dot{color:#f59e0b}
.wk{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.wk .lnk{font-size:24px;padding:2px 14px}
.row{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.l,.r{min-width:0}
.r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right;align-self:stretch}
.r .sm{margin:0}
.r .sm:last-child{margin-top:auto}
.ls{font-weight:600}
.hw{white-space:pre-wrap;word-break:break-word;margin-top:6px}
.l .sm{margin:10px 0 0}
.card.done{opacity:.6}
.ph{display:inline-block;position:relative}
.ph img{width:72px;height:72px;object-fit:cover;border-radius:10px;margin:6px 6px 0 0;display:inline-block}
.x{position:absolute;top:2px;right:8px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:0}
.lrow{display:flex;align-items:center;gap:8px}.lrow b{width:20px}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 60px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);animation:fade .2s ease}
.ov img{display:block;max-width:100%;margin:0 auto 12px;border-radius:12px}
.cl{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app.anim .card,#app.anim .tabs{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(
  'https://lkwzlpjzockmhbgmlbjn.supabase.co',
  'sb_publishable_ZuQJxXStGL0vS0Qt11BrjQ_pymccAQj'
);

const T = {
  ru: {title:'Электронный дневник',email:'Почта',pass:'Пароль (минимум 6 символов)',login:'Войти',signup:'Зарегистрироваться',
    forgot:'Забыли пароль?',toLogin:'Уже есть аккаунт? Войти',toSignup:'Нет аккаунта? Регистрация',code:'Код из письма',
    confirm:'Подтвердить',verifyH:'Введите код',verifyT:'Мы отправили код на',sent:'Код отправлен на почту',
    forgotH:'Восстановление пароля',send:'Отправить код',newH:'Новый пароль',save:'Сохранить',out:'Выйти',
    wait:'Ждём одобрения',waitT:'Регистрация принята. Создатель дневника должен вас одобрить, после этого здесь появится расписание. Загляните позже.',
    soon:'Здесь скоро будет расписание и домашние задания.',diary:'Дневник',people:'Люди',approve:'Одобрить',
    mkAdmin:'Сделать админом',rmAdmin:'Снять права админа',revoke:'Убрать доступ',r_pending:'Ждёт одобрения',
    r_student:'Ученик',r_admin:'Админ',r_owner:'Создатель',badlogin:'Неверная почта или пароль',
    badcode:'Неверный или просроченный код',empty:'Пока никого нет',load:'Загрузка…',schedule:'Расписание',nosched:'Расписание ещё не заполнено.',noschedEd:'Расписание ещё не заполнено. Заполните его во вкладке «Расписание».',edit:'Изменить',add:'Добавить ДЗ',topic:'Тема урока',hwtext:'Домашнее задание',photo:'Фото',cancel:'Отмена',effFrom:'Действует с (дата приведётся к понедельнику)',effHint:'Прошлые недели не изменятся: новое расписание работает с этой даты.',subject:'Предмет',saveSched:'Сохранить расписание',saved:'Сохранено',done:'Сделано'},
  en: {title:'Class Diary',email:'Email',pass:'Password (at least 6 characters)',login:'Log in',signup:'Sign up',
    forgot:'Forgot password?',toLogin:'Have an account? Log in',toSignup:'No account? Sign up',code:'Code from the email',
    confirm:'Confirm',verifyH:'Enter the code',verifyT:'We sent a code to',sent:'Code sent to your email',
    forgotH:'Password recovery',send:'Send code',newH:'New password',save:'Save',out:'Log out',
    wait:'Waiting for approval',waitT:'Your registration was received. The diary owner must approve you, then the schedule will appear here. Please check back later.',
    soon:'The schedule and homework will appear here soon.',diary:'Diary',people:'People',approve:'Approve',
    mkAdmin:'Make admin',rmAdmin:'Remove admin rights',revoke:'Revoke access',r_pending:'Pending approval',
    r_student:'Student',r_admin:'Admin',r_owner:'Owner',badlogin:'Wrong email or password',
    badcode:'Wrong or expired code',empty:'Nobody yet',load:'Loading…',schedule:'Schedule',nosched:'The schedule is not filled in yet.',noschedEd:'The schedule is empty. Fill it in on the Schedule tab.',edit:'Edit',add:'Add homework',topic:'Lesson topic',hwtext:'Homework (in Russian)',photo:'Photo',cancel:'Cancel',effFrom:'Effective from (snapped to Monday)',effHint:'Past weeks stay unchanged: the new schedule applies from this date.',subject:'Subject',saveSched:'Save schedule',saved:'Saved',done:'Done'}
};
let lang = 'ru';
try { lang = localStorage.getItem('lang') || 'ru'; } catch (e) {}
const t = k => T[lang][k] || k;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const S = {ready:false, view:'login', otpType:'signup', email:'', f:{}, msg:'', info:'', busy:false,
           user:null, profile:null, tab:'diary', people:[], recovering:false,
           week:'', day:1, versions:[], slots:[], hw:{}, urls:{}, edit:null, sched:null, done:new Set(), viewer:null, pop:null};
const BUCKET = 'homework-photos';
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = x => { const [y, m, d] = x.split('-').map(Number); return new Date(y, m - 1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const addDays = (x, n) => { const d = parse(x); d.setDate(d.getDate() + n); return fmt(d); };
const fmtShort = x => { const d = parse(x); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
const DN = {ru:['Пн','Вт','Ср','Чт','Пт'], en:['Mon','Tue','Wed','Thu','Fri']};
const dayDate = () => addDays(S.week, S.day - 1);
const canEdit = () => !!S.profile && (S.profile.role === 'admin' || S.profile.role === 'owner');
{ const now = new Date(), wd = (now.getDay() + 6) % 7, mon = fmt(mondayOf(now));
  S.week = wd > 4 ? addDays(mon, 7) : mon; S.day = wd > 4 ? 1 : wd + 1; }

const dark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paintTheme() { const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark() ? '#0c0c0e' : '#f2f2f4'; }
function setTheme(x) { document.documentElement.dataset.theme = x; try { localStorage.setItem('theme', x); } catch (e) {} paintTheme(); }
try { const th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
paintTheme();
const svg = p => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const SUN = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const MOON = svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
const viewer = () => S.viewer ? `<div class="ov" data-a="closeview">${S.viewer.map(u => `<img src="${esc(u)}">`).join('')}<button class="cl" data-a="closeview">✕</button></div>` : '';

const fld = (n, type, ph, ac) =>
  `<input name="${n}" type="${type}" placeholder="${esc(ph)}" autocomplete="${ac}" value="${esc(S.f[n])}" required>`;
const link = (v, label) => `<div><button type="button" class="lnk" style="padding-left:0" data-a="go" data-v="${v}">${label}</button></div>`;
const form = (name, inner, label) =>
  `<form data-s="${name}">${inner}${S.msg ? `<div class="msg">${esc(S.msg)}</div>` : ''}${S.info ? `<div class="info">${esc(S.info)}</div>` : ''}
   <button class="btn"${S.busy ? ' disabled' : ''}>${label}</button></form>`;

function authView() {
  const v = S.view;
  if (v === 'signup') return `<div class="card"><h3>${t('signup')}</h3>${form('signup', fld('email','email',t('email'),'email') + fld('password','password',t('pass'),'new-password'), t('signup'))}${link('login', t('toLogin'))}</div>`;
  if (v === 'forgot') return `<div class="card"><h3>${t('forgotH')}</h3>${form('forgot', fld('email','email',t('email'),'email'), t('send'))}${link('login', t('toLogin'))}</div>`;
  if (v === 'verify') return `<div class="card"><h3>${t('verifyH')}</h3><p class="badge">${t('verifyT')} ${esc(S.email)}</p>${form('verify', `<input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="${t('code')}" value="${esc(S.f.code)}" required>`, t('confirm'))}${link('login', t('toLogin'))}</div>`;
  return `<div class="card"><h3>${t('login')}</h3>${form('login', fld('email','email',t('email'),'email') + fld('password','password',t('pass').split(' (')[0],'current-password'), t('login'))}${link('forgot', t('forgot'))}${link('signup', t('toSignup'))}</div>`;
}

function peopleView() {
  const ord = {pending:0, student:1, admin:2, owner:3};
  const list = [...S.people].sort((a, b) => ord[a.role] - ord[b.role]);
  if (!list.length) return `<div class="card">${t('empty')}</div>`;
  return list.map(u => {
    const B = (role, label) => `<button class="sm" data-a="role" data-v="${u.id}|${role}">${label}</button>`;
    let btns = '';
    if (u.role === 'pending') btns = B('student', t('approve'));
    if (u.role === 'student') btns = B('admin', t('mkAdmin')) + B('pending', t('revoke'));
    if (u.role === 'admin') btns = B('student', t('rmAdmin')) + B('pending', t('revoke'));
    return `<div class="card"><b>${esc(u.email)}</b><div class="badge">${t('r_' + u.role)}</div>${btns}</div>`;
  }).join('');
}

function appView() {
  const r = S.profile && S.profile.role, ed = canEdit();
  if (!r || r === 'pending') return `<div class="card"><h3>${t('wait')}</h3><p>${t('waitT')}</p></div>`;
  const tabs = [['diary', t('diary')]];
  if (ed) tabs.push(['sched', t('schedule')]);
  if (r === 'owner') tabs.push(['people', t('people')]);
  let h = `<div class="badge">${esc(S.user.email)} · ${t('r_' + r)}</div>`;
  if (tabs.length > 1) h += `<div class="tabs">${tabs.map(x => `<button class="tab${S.tab === x[0] ? ' on' : ''}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  if (S.tab === 'people' && r === 'owner') return h + peopleView();
  if (S.tab === 'sched' && ed && S.sched) return h + schedView();
  return h + diaryView();
}

function subjects(date) {
  const v = S.versions.find(v => v.effective_from <= date);
  if (!v) return null;
  const wd = (parse(date).getDay() + 6) % 7 + 1, o = {};
  S.slots.filter(x => x.version_id === v.id && x.weekday === wd).forEach(x => o[x.lesson_no] = x.subject);
  return o;
}

const hasHw = w => !!(w.topic || w.body || (w.photo_paths || []).length);
const todo = d => Object.values(S.hw).some(w => w.lesson_date === d && hasHw(w) && !S.done.has(w.id));

function diaryView() {
  const ed = canEdit(), date = dayDate(), subj = subjects(date) || {};
  const nos = Object.keys(subj).map(Number).sort((a, b) => a - b);
  const h = `<div class="wk"><button class="lnk" data-a="week" data-v="-1">‹</button><b>${fmtShort(S.week)} – ${fmtShort(addDays(S.week, 4))}</b><button class="lnk" data-a="week" data-v="1">›</button></div><div class="tabs">` +
    DN[lang].map((n, i) => `<button class="tab${S.day === i + 1 ? ' on' : ''}" data-a="day" data-v="${i + 1}">${n}<br><small>${parse(addDays(S.week, i)).getDate()}${todo(addDays(S.week, i)) ? ' <span class="dot">●</span>' : ''}</small></button>`).join('') + '</div>';
  if (!nos.length) return h + `<div class="card">${t(ed ? 'noschedEd' : 'nosched')}</div>`;
  return h + nos.map(no => {
    if (S.edit && S.edit.date === date && S.edit.no === no) return editForm();
    const w = S.hw[date + '|' + no], has = w && hasHw(w), dn = w && S.done.has(w.id);
    const ph = w ? (w.photo_paths || []).filter(p => S.urls[p]).length : 0;
    const mid = has ? (w.body ? `<div class="hw">${esc(w.body)}</div>` : '') : '<div class="badge">—</div>';
    const doneBtn = has ? `<button class="sm${dn ? ' on' : ''}${S.pop === w.id ? ' pop' : ''}" data-a="done" data-v="${w.id}">${dn ? '✓ ' : ''}${t('done')}</button>` : '';
    const chip = ph ? `<button class="chip" data-a="photos" data-v="${date}|${no}">+ ${t('photo').toLowerCase()}${ph > 1 ? ' (' + ph + ')' : ''}</button>` : '';
    return `<div class="card row${dn ? ' done' : ''}"><div class="l"><div class="ls"><b>${no}.</b> ${esc(subj[no])}</div>${mid}${doneBtn}</div><div class="r">${has && w.topic ? `<b>${esc(w.topic)}</b>` : ''}${chip}${ed ? `<button class="sm" data-a="edit" data-v="${no}">${t(w ? 'edit' : 'add')}</button>` : ''}</div></div>`;
  }).join('');
}

function editForm() {
  const e = S.edit;
  const ph = e.photos.map(p => `<div class="ph"><img src="${esc(S.urls[p] || '')}"><button type="button" class="x" data-a="rmphoto" data-v="${esc(p)}">✕</button></div>`).join('');
  const inner = `<input name="hwtopic" placeholder="${t('topic')}" value="${esc(S.f.hwtopic)}"><textarea name="hwbody" placeholder="${t('hwtext')}">${esc(S.f.hwbody)}</textarea><div>${ph}</div><label class="sm">+ ${t('photo')}<input id="hwfile" type="file" accept="image/*" multiple hidden></label>`;
  return `<div class="card"><b>${e.no}. ${esc(e.subject)}</b>${form('savehw', inner, t('save'))}<button class="lnk" style="padding-left:0" data-a="cancel">${t('cancel')}</button></div>`;
}

function schedView() {
  const d = S.sched.day;
  let h = `<div class="card"><div class="badge">${t('effFrom')}</div><input type="date" name="sfrom" value="${esc(S.f.sfrom)}"><div class="badge">${t('effHint')}</div></div><div class="tabs">` +
    DN[lang].map((n, i) => `<button class="tab${d === i + 1 ? ' on' : ''}" data-a="sday" data-v="${i + 1}">${n}</button>`).join('') + '</div><div class="card">';
  for (let n = 1; n <= 8; n++) h += `<div class="lrow"><b>${n}</b><input name="s_${d}_${n}" placeholder="${t('subject')}" value="${esc(S.f['s_' + d + '_' + n])}"></div>`;
  return h + `${S.msg ? `<div class="msg">${esc(S.msg)}</div>` : ''}${S.info ? `<div class="info">${esc(S.info)}</div>` : ''}<button class="btn"${S.busy ? ' disabled' : ''} data-a="savesched">${t('saveSched')}</button></div>`;
}

function initSched() {
  S.sched = {day: 1}; S.f.sfrom = fmt(mondayOf(new Date()));
  const v = S.versions.find(x => x.effective_from <= S.f.sfrom);
  for (let d = 1; d <= 5; d++) for (let n = 1; n <= 8; n++) {
    const c = v && S.slots.find(x => x.version_id === v.id && x.weekday === d && x.lesson_no === n);
    S.f['s_' + d + '_' + n] = c ? c.subject : '';
  }
}

async function loadDiary() {
  const [v, sl] = await Promise.all([
    sb.from('schedule_versions').select('id,effective_from').order('effective_from', {ascending:false}),
    sb.from('schedule_slots').select('version_id,weekday,lesson_no,subject')]);
  S.versions = v.data || []; S.slots = sl.data || [];
  const {data} = await sb.from('homework').select('*').gte('lesson_date', S.week).lte('lesson_date', addDays(S.week, 4));
  S.hw = {}; (data || []).forEach(x => S.hw[x.lesson_date + '|' + x.lesson_no] = x);
  const dn = await sb.from('homework_done').select('homework_id');
  S.done = new Set((dn.data || []).map(x => x.homework_id));
  const paths = [...new Set((data || []).flatMap(x => x.photo_paths || []))].filter(p => !S.urls[p]);
  if (paths.length) {
    const {data: u} = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
    (u || []).forEach(x => { if (x.signedUrl) S.urls[x.path] = x.signedUrl; });
  }
}

async function loadTab() {
  if (S.tab === 'people') await loadPeople();
  else { await loadDiary(); if (S.tab === 'sched') initSched(); }
}

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('image')), 'image/jpeg', .82);
    };
    img.onerror = () => rej(new Error('image'));
    img.src = u;
  });
}

async function uploadPhotos(files) {
  if (!S.edit || S.busy) return;
  S.busy = true; S.msg = ''; render();
  try {
    for (const f of files) {
      const path = `${S.edit.date}/${S.edit.no}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}.jpg`;
      const {error} = await sb.storage.from(BUCKET).upload(path, await shrink(f), {contentType:'image/jpeg'});
      if (error) throw error;
      const {data} = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
      S.urls[path] = data.signedUrl; S.edit.photos.push(path); S.edit.added.push(path);
    }
  } catch (e) { S.msg = errText(e); }
  finally { S.busy = false; render(); }
}

function render() {
  let body;
  if (!S.ready) body = `<div class="card">${t('load')}</div>`;
  else if (S.user && S.recovering) body = `<div class="card"><h3>${t('newH')}</h3>${form('newpass', fld('password','password',t('pass'),'new-password'), t('save'))}</div>`;
  else if (S.user) body = appView();
  else body = authView();
  document.getElementById('app').innerHTML =
    `<div class="top"><b>${t('title')}</b><span><button class="lnk" data-a="theme">${dark() ? SUN : MOON}</button><button class="lnk" data-a="lang">${lang === 'ru' ? 'EN' : 'RU'}</button>${S.user ? `<button class="lnk" data-a="out">${t('out')}</button>` : ''}</span></div>` + body + viewer();
}

function errText(e) {
  const m = (e && e.message) || '';
  if (/invalid login/i.test(m)) return t('badlogin');
  if (/otp|token|expired|invalid/i.test(m)) return t('badcode');
  return m;
}

async function loadPeople() {
  const {data} = await sb.from('profiles').select('id,email,role').order('created_at', {ascending:false});
  S.people = data || [];
}

async function load() {
  if (S.user) {
    const {data} = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    S.profile = data;
    if (data && data.role !== 'pending') await loadTab();
  } else S.profile = null;
  S.ready = true;
  render();
}

async function act(a, v) {
  if (S.busy) return;
  S.busy = true; S.msg = ''; S.info = ''; S.pop = null;
  try {
    const email = (S.f.email || '').trim();
    if (a === 'lang') { lang = lang === 'ru' ? 'en' : 'ru'; try { localStorage.setItem('lang', lang); } catch (e) {} }
    else if (a === 'go') { S.view = v; S.f.password = ''; }
    else if (a === 'tab') { S.tab = v; S.edit = null; await loadTab(); }
    else if (a === 'out') { await sb.auth.signOut(); S.view = 'login'; S.f = {}; S.edit = null; S.sched = null; S.tab = 'diary'; }
    else if (a === 'role') {
      const [id, role] = v.split('|');
      const {error} = await sb.from('profiles').update({role}).eq('id', id);
      if (error) throw error;
      await loadPeople();
    }
    else if (a === 'theme') { setTheme(dark() ? 'light' : 'dark'); }
    else if (a === 'photos') { const w = S.hw[v]; S.viewer = ((w && w.photo_paths) || []).map(x => S.urls[x]).filter(Boolean); }
    else if (a === 'closeview') { S.viewer = null; }
    else if (a === 'done') {
      const id = Number(v);
      if (S.done.has(id)) {
        const {error} = await sb.from('homework_done').delete().eq('homework_id', id).eq('user_id', S.user.id);
        if (error) throw error;
        S.done.delete(id);
      } else {
        const {error} = await sb.from('homework_done').insert({homework_id: id, user_id: S.user.id});
        if (error) throw error;
        S.done.add(id); S.pop = id;
      }
    }
    else if (a === 'week') { S.week = addDays(S.week, 7 * Number(v)); S.edit = null; await loadDiary(); }
    else if (a === 'day') { S.day = Number(v); S.edit = null; }
    else if (a === 'sday') { S.sched.day = Number(v); }
    else if (a === 'edit') {
      const no = Number(v), date = dayDate(), w = S.hw[date + '|' + no];
      S.edit = {date, no, subject: (subjects(date) || {})[no] || '', photos: [...(w ? w.photo_paths || [] : [])], removed: [], added: []};
      S.f.hwtopic = w && w.topic || ''; S.f.hwbody = w && w.body || '';
    }
    else if (a === 'rmphoto') { S.edit.photos = S.edit.photos.filter(p => p !== v); S.edit.removed.push(v); }
    else if (a === 'cancel') {
      if (S.edit.added.length) await sb.storage.from(BUCKET).remove(S.edit.added);
      S.edit = null;
    }
    else if (a === 'savehw') {
      const e = S.edit, key = e.date + '|' + e.no;
      const row = {lesson_date: e.date, lesson_no: e.no, topic: (S.f.hwtopic || '').trim() || null, body: (S.f.hwbody || '').trim() || null,
        photo_paths: e.photos, updated_by: S.user.id, updated_at: new Date().toISOString()};
      if (!S.hw[key]) row.created_by = S.user.id;
      const {error} = await sb.from('homework').upsert(row, {onConflict: 'lesson_date,lesson_no'});
      if (error) throw error;
      if (e.removed.length) await sb.storage.from(BUCKET).remove(e.removed);
      S.edit = null; await loadDiary();
    }
    else if (a === 'savesched') {
      if (!S.f.sfrom) throw new Error('date');
      const from = fmt(mondayOf(parse(S.f.sfrom))); S.f.sfrom = from;
      const old = S.versions.find(x => x.effective_from === from); let id;
      if (old) {
        id = old.id;
        const {error} = await sb.from('schedule_slots').delete().eq('version_id', id);
        if (error) throw error;
      } else {
        const {data, error} = await sb.from('schedule_versions').insert({effective_from: from, created_by: S.user.id}).select('id').single();
        if (error) throw error;
        id = data.id;
      }
      const rows = [];
      for (let d = 1; d <= 5; d++) for (let n = 1; n <= 8; n++) {
        const sub = (S.f['s_' + d + '_' + n] || '').trim();
        if (sub) rows.push({version_id: id, weekday: d, lesson_no: n, subject: sub});
      }
      if (rows.length) { const {error} = await sb.from('schedule_slots').insert(rows); if (error) throw error; }
      await loadDiary(); S.info = t('saved');
    }
    else if (a === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: S.f.password || ''});
      if (error) {
        if (/not confirmed/i.test(error.message)) {
          await sb.auth.resend({type:'signup', email});
          S.email = email; S.otpType = 'signup'; S.view = 'verify'; S.info = t('sent'); return;
        }
        throw error;
      }
    }
    else if (a === 'signup') {
      const {error} = await sb.auth.signUp({email, password: S.f.password || ''});
      if (error) throw error;
      S.email = email; S.otpType = 'signup'; S.view = 'verify'; S.info = t('sent');
    }
    else if (a === 'forgot') {
      const {error} = await sb.auth.resetPasswordForEmail(email);
      if (error) throw error;
      S.email = email; S.otpType = 'recovery'; S.view = 'verify'; S.info = t('sent');
    }
    else if (a === 'verify') {
      S.recovering = S.otpType === 'recovery';
      const {error} = await sb.auth.verifyOtp({email: S.email, token: (S.f.code || '').trim(), type: S.otpType});
      if (error) { S.recovering = false; throw error; }
      S.f.code = '';
    }
    else if (a === 'newpass') {
      const {error} = await sb.auth.updateUser({password: S.f.password || ''});
      if (error) throw error;
      S.recovering = false; S.f = {};
      await load();
    }
  } catch (e) {
    S.msg = errText(e);
  } finally {
    S.busy = false;
    render();
    if (['tab', 'day', 'week', 'go', 'sday', 'out'].includes(a)) {
      const el = document.getElementById('app'); el.classList.add('anim');
      setTimeout(() => el.classList.remove('anim'), 700);
    }
  }
}

const app = document.getElementById('app');
app.addEventListener('input', e => { if (e.target.name) S.f[e.target.name] = e.target.value; });
app.addEventListener('change', e => { if (e.target.id === 'hwfile') uploadPhotos([...e.target.files]); });
app.addEventListener('submit', e => { e.preventDefault(); act(e.target.dataset.s); });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b) act(b.dataset.a, b.dataset.v);
});

sb.auth.onAuthStateChange((ev, sess) => {
  if (ev === 'PASSWORD_RECOVERY') S.recovering = true;
  S.user = sess ? sess.user : null;
  setTimeout(load, 0);
});
setTimeout(() => { if (!S.ready) load(); }, 3000);
document.addEventListener('touchstart', () => {}, {passive: true});
render();
</script>
