<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="theme-color" content="#4f46e5">
<title>Электронный дневник</title>
<style>
:root{--p:#4f46e5;--bg:#f5f6fa;--c:#fff;--t:#1c1e2b;--m:#6b7080;--e:#d93b3b;--ok:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#12131a;--c:#1d1f2b;--t:#eceef7;--m:#9aa0b5}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card{background:var(--c);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
h3{margin:0 0 8px}
input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid #c9ccd8;border-radius:10px;margin:6px 0 10px;background:var(--c);color:var(--t)}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:600}
.btn:disabled{opacity:.6}
.sm{padding:8px 12px;border:1px solid var(--p);background:transparent;color:var(--p);border-radius:8px;margin:8px 8px 0 0;font-size:14px}
.lnk{background:none;border:0;color:var(--p);padding:8px 0 8px 12px;font-size:15px}
.msg{color:var(--e);margin:4px 0 8px}
.info{color:var(--ok);margin:4px 0 8px}
.tabs{display:flex;gap:8px;margin:10px 0 12px}
.tab{flex:1;padding:10px;border:0;border-radius:10px;background:var(--c);color:var(--t)}
.tab.on{background:var(--p);color:#fff}
.badge{font-size:13px;color:var(--m)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(
  'https://lkwzlpjzockmhbgmlbjn.supabase.co',
  'sb_publishable_ZuQJxXStGL0vS0Qt11BrjQ_pymccAQj'
);

const T = {
  ru: {title:'Электронный дневник',email:'Почта',pass:'Пароль (минимум 6 символов)',login:'Войти',signup:'Зарегистрироваться',
    forgot:'Забыли пароль?',toLogin:'Уже есть аккаунт? Войти',toSignup:'Нет аккаунта? Регистрация',code:'Код из письма',
    confirm:'Подтвердить',verifyH:'Введите код',verifyT:'Мы отправили код на',sent:'Код отправлен на почту',
    forgotH:'Восстановление пароля',send:'Отправить код',newH:'Новый пароль',save:'Сохранить',out:'Выйти',
    wait:'Ждём одобрения',waitT:'Регистрация принята. Создатель дневника должен вас одобрить, после этого здесь появится расписание. Загляните позже.',
    soon:'Здесь скоро будет расписание и домашние задания.',diary:'Дневник',people:'Люди',approve:'Одобрить',
    mkAdmin:'Сделать админом',rmAdmin:'Снять права админа',revoke:'Убрать доступ',r_pending:'Ждёт одобрения',
    r_student:'Ученик',r_admin:'Админ',r_owner:'Создатель',badlogin:'Неверная почта или пароль',
    badcode:'Неверный или просроченный код',empty:'Пока никого нет',load:'Загрузка…'},
  en: {title:'Class Diary',email:'Email',pass:'Password (at least 6 characters)',login:'Log in',signup:'Sign up',
    forgot:'Forgot password?',toLogin:'Have an account? Log in',toSignup:'No account? Sign up',code:'Code from the email',
    confirm:'Confirm',verifyH:'Enter the code',verifyT:'We sent a code to',sent:'Code sent to your email',
    forgotH:'Password recovery',send:'Send code',newH:'New password',save:'Save',out:'Log out',
    wait:'Waiting for approval',waitT:'Your registration was received. The diary owner must approve you, then the schedule will appear here. Please check back later.',
    soon:'The schedule and homework will appear here soon.',diary:'Diary',people:'People',approve:'Approve',
    mkAdmin:'Make admin',rmAdmin:'Remove admin rights',revoke:'Revoke access',r_pending:'Pending approval',
    r_student:'Student',r_admin:'Admin',r_owner:'Owner',badlogin:'Wrong email or password',
    badcode:'Wrong or expired code',empty:'Nobody yet',load:'Loading…'}
};
let lang = 'ru';
try { lang = localStorage.getItem('lang') || 'ru'; } catch (e) {}
const t = k => T[lang][k] || k;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const S = {ready:false, view:'login', otpType:'signup', email:'', f:{}, msg:'', info:'', busy:false,
           user:null, profile:null, tab:'diary', people:[], recovering:false};

const fld = (n, type, ph, ac) =>
  `<input name="${n}" type="${type}" placeholder="${esc(ph)}" autocomplete="${ac}" value="${esc(S.f[n])}" required>`;
const link = (v, label) => `<div><button type="button" class="lnk" style="padding-left:0" data-a="go" data-v="${v}">${label}</button></div>`;
const form = (name, inner, label) =>
  `<form data-s="${name}">${inner}${S.msg ? `<div class="msg">${esc(S.msg)}</div>` : ''}${S.info ? `<div class="info">${esc(S.info)}</div>` : ''}
   <button class="btn"${S.busy ? ' disabled' : ''}>${label}</button></form>`;

function authView() {
  const v = S.view;
  if (v === 'signup') return `<div class="card"><h3>${t('signup')}</h3>${form('signup', fld('email','email',t('email'),'email') + fld('password','password',t('pass'),'new-password'), t('signup'))}${link('login', t('toLogin'))}</div>`;
  if (v === 'forgot') return `<div class="card"><h3>${t('forgotH')}</h3>${form('forgot', fld('email','email',t('email'),'email'), t('send'))}${link('login', t('toLogin'))}</div>`;
  if (v === 'verify') return `<div class="card"><h3>${t('verifyH')}</h3><p class="badge">${t('verifyT')} ${esc(S.email)}</p>${form('verify', `<input name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="${t('code')}" value="${esc(S.f.code)}" required>`, t('confirm'))}${link('login', t('toLogin'))}</div>`;
  return `<div class="card"><h3>${t('login')}</h3>${form('login', fld('email','email',t('email'),'email') + fld('password','password',t('pass').split(' (')[0],'current-password'), t('login'))}${link('forgot', t('forgot'))}${link('signup', t('toSignup'))}</div>`;
}

function peopleView() {
  const ord = {pending:0, student:1, admin:2, owner:3};
  const list = [...S.people].sort((a, b) => ord[a.role] - ord[b.role]);
  if (!list.length) return `<div class="card">${t('empty')}</div>`;
  return list.map(u => {
    const B = (role, label) => `<button class="sm" data-a="role" data-v="${u.id}|${role}">${label}</button>`;
    let btns = '';
    if (u.role === 'pending') btns = B('student', t('approve'));
    if (u.role === 'student') btns = B('admin', t('mkAdmin')) + B('pending', t('revoke'));
    if (u.role === 'admin') btns = B('student', t('rmAdmin')) + B('pending', t('revoke'));
    return `<div class="card"><b>${esc(u.email)}</b><div class="badge">${t('r_' + u.role)}</div>${btns}</div>`;
  }).join('');
}

function appView() {
  const r = S.profile && S.profile.role;
  if (!r || r === 'pending') return `<div class="card"><h3>${t('wait')}</h3><p>${t('waitT')}</p></div>`;
  let h = `<div class="badge">${esc(S.user.email)} · ${t('r_' + r)}</div>`;
  if (r === 'owner') h += `<div class="tabs"><button class="tab${S.tab==='diary'?' on':''}" data-a="tab" data-v="diary">${t('diary')}</button><button class="tab${S.tab==='people'?' on':''}" data-a="tab" data-v="people">${t('people')}</button></div>`;
  return h + (r === 'owner' && S.tab === 'people' ? peopleView() : `<div class="card">${t('soon')}</div>`);
}

function render() {
  let body;
  if (!S.ready) body = `<div class="card">${t('load')}</div>`;
  else if (S.user && S.recovering) body = `<div class="card"><h3>${t('newH')}</h3>${form('newpass', fld('password','password',t('pass'),'new-password'), t('save'))}</div>`;
  else if (S.user) body = appView();
  else body = authView();
  document.getElementById('app').innerHTML =
    `<div class="top"><b>${t('title')}</b><span><button class="lnk" data-a="lang">${lang === 'ru' ? 'EN' : 'RU'}</button>${S.user ? `<button class="lnk" data-a="out">${t('out')}</button>` : ''}</span></div>` + body;
}

function errText(e) {
  const m = (e && e.message) || '';
  if (/invalid login/i.test(m)) return t('badlogin');
  if (/otp|token|expired|invalid/i.test(m)) return t('badcode');
  return m;
}

async function loadPeople() {
  const {data} = await sb.from('profiles').select('id,email,role').order('created_at', {ascending:false});
  S.people = data || [];
}

async function load() {
  if (S.user) {
    const {data} = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    S.profile = data;
    if (data && data.role === 'owner' && S.tab === 'people') await loadPeople();
  } else S.profile = null;
  S.ready = true;
  render();
}

async function act(a, v) {
  if (S.busy) return;
  S.busy = true; S.msg = ''; S.info = '';
  try {
    const email = (S.f.email || '').trim();
    if (a === 'lang') { lang = lang === 'ru' ? 'en' : 'ru'; try { localStorage.setItem('lang', lang); } catch (e) {} }
    else if (a === 'go') { S.view = v; S.f.password = ''; }
    else if (a === 'tab') { S.tab = v; if (v === 'people') await loadPeople(); }
    else if (a === 'out') { await sb.auth.signOut(); S.view = 'login'; S.f = {}; }
    else if (a === 'role') {
      const [id, role] = v.split('|');
      const {error} = await sb.from('profiles').update({role}).eq('id', id);
      if (error) throw error;
      await loadPeople();
    }
    else if (a === 'login') {
      const {error} = await sb.auth.signInWithPassword({email, password: S.f.password || ''});
      if (error) {
        if (/not confirmed/i.test(error.message)) {
          await sb.auth.resend({type:'signup', email});
          S.email = email; S.otpType = 'signup'; S.view = 'verify'; S.info = t('sent'); return;
        }
        throw error;
      }
    }
    else if (a === 'signup') {
      const {error} = await sb.auth.signUp({email, password: S.f.password || ''});
      if (error) throw error;
      S.email = email; S.otpType = 'signup'; S.view = 'verify'; S.info = t('sent');
    }
    else if (a === 'forgot') {
      const {error} = await sb.auth.resetPasswordForEmail(email);
      if (error) throw error;
      S.email = email; S.otpType = 'recovery'; S.view = 'verify'; S.info = t('sent');
    }
    else if (a === 'verify') {
      S.recovering = S.otpType === 'recovery';
      const {error} = await sb.auth.verifyOtp({email: S.email, token: (S.f.code || '').trim(), type: S.otpType});
      if (error) { S.recovering = false; throw error; }
      S.f.code = '';
    }
    else if (a === 'newpass') {
      const {error} = await sb.auth.updateUser({password: S.f.password || ''});
      if (error) throw error;
      S.recovering = false; S.f = {};
      await load();
    }
  } catch (e) {
    S.msg = errText(e);
  } finally {
    S.busy = false;
    render();
  }
}

const app = document.getElementById('app');
app.addEventListener('input', e => { if (e.target.name) S.f[e.target.name] = e.target.value; });
app.addEventListener('submit', e => { e.preventDefault(); act(e.target.dataset.s); });
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b) act(b.dataset.a, b.dataset.v);
});

sb.auth.onAuthStateChange((ev, sess) => {
  if (ev === 'PASSWORD_RECOVERY') S.recovering = true;
  S.user = sess ? sess.user : null;
  setTimeout(load, 0);
});
setTimeout(() => { if (!S.ready) load(); }, 3000);
render();
</script>
</body>
</html>
